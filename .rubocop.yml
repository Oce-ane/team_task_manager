# Omakase Ruby styling for Rails
inherit_gem:
  rubocop-rails: config/default.yml

AllCops:
  TargetRubyVersion: 3.2
  Exclude:
    - 'bin/*'
    - 'db/schema.rb'
    - 'node_modules/**/*'
    - 'vendor/**/*'

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  Max: 25

Style/FrozenStringLiteralComment:
  Enabled: false
